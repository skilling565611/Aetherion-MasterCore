[project]
name = "aetherion-ai-image-tools"
version = "0.1.0"
description = "Local image organization tools for AI character assets."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
ai = [
  "numpy>=1.24",
  "onnxruntime>=1.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
